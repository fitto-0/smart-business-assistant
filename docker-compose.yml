services:
  postgres:
    image: postgres:15-alpine
    container_name: smart-business-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: smart-business-backend
    restart: unless-stopped

    ports:
      - "5000:5000"

    env_file:
      - .env

    environment:
      NODE_ENV: production
      DB_HOST: postgres
      AI_SERVICE_URL: http://ai:8000
      PORT: 5000

    depends_on:
      postgres:
        condition: service_healthy
      ai:
        condition: service_started

    command: sh -c "node db/migrate.js && node server.js"

  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile

    container_name: smart-business-ai
    restart: unless-stopped

    ports:
      - "8000:8000"

    environment:
      PORT: 8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: smart-business-frontend
    restart: unless-stopped

    ports:
      - "3000:3000"

    env_file:
      - .env

    environment:
      NODE_ENV: production

    depends_on:
      - backend

volumes:
  postgres_data: